name: 'Bug report'
description: 'Something broke. Tell us what happened.'
title: '[BUG] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        If a **processing stage** failed, the *Pipeline error* form is the
        better fit — it asks for the things that usually identify the cause.

  - type: textarea
    id: describe-bug
    attributes:
      label: '> describe_bug'
      description: 'What went wrong? Be specific.'
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: '> reproduce'
      description: 'The shortest path to seeing it happen.'
      placeholder: |
        1. Go to '...'
        2. Upload image '...'
        3. See error
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: '> expected_behavior'
      description: 'What should have happened instead?'
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: '> screenshots'
      description: 'If applicable. A picture is worth a thousand log lines.'
    validations:
      required: false

  - type: textarea
    id: image-info
    attributes:
      label: '> image_info'
      description: |
        If an image was involved: source (Gemini / DALL-E / Midjourney /
        Stable Diffusion / Flux / other), background type (checkerboard /
        solid / complex / watermarked), and dimensions.
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: '> browser'
      description: 'Browser and version.'
      placeholder: 'Chrome 130'
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: '> os'
      placeholder: 'Windows 11, macOS 14, Ubuntu 24.04'
    validations:
      required: true

  - type: dropdown
    id: webgpu
    attributes:
      label: '> webgpu_supported'
      description: 'Check at https://webgpureport.org if you are not sure.'
      options:
        - 'yes'
        - 'no'
        - "don't know"
    validations:
      required: false

  - type: textarea
    id: console
    attributes:
      label: '> console_errors'
      description: 'Anything red in DevTools. Paste it as-is.'
      render: text
    validations:
      required: false

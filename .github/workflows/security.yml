name: Security

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Weekly scan: Mondays 06:00 UTC. Catches newly-disclosed CVEs
    # even when the repo is idle.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Gated through scripts/audit-gate.mjs rather than raw `npm audit`.
      #
      # Raw audit had been red for months: several findings have no upstream fix
      # (sharp inherits libvips CVEs and 0.35.3 is the latest published), so the
      # job could never go green and everyone learned to scroll past it. A
      # permanently-red required check is worse than no check — a genuinely new
      # advisory arrives invisible among the familiar ones.
      #
      # The gate fails on any advisory not justified in .audit-allowlist.json,
      # and on any allowlist entry past its reviewBy date, so accepted risk
      # cannot quietly become permanent. Accepted findings are printed on every
      # run instead of being silenced.
      - name: Audit gate (npm audit + reviewed allowlist)
        run: node scripts/audit-gate.mjs

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'

  # OSV-Scanner cross-references multiple vuln databases (OSV.dev, GHSA,
  # PyPA, Go vuln DB, etc.) and tends to surface advisories before they
  # reach the GHSA feed npm-audit reads. Closes #192.
  osv-scanner:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.0
        with:
          # `--skip-git` was removed in osv-scanner v2.x (git-history
          # scanning is no longer the default and is controlled via a
          # different mechanism). Action v2.3.5 was bumped in #253; this
          # restores compatibility without losing dependency coverage.
          scan-args: |-
            --recursive
            ./
